<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name or "BETACODE" }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
{% set ep = request.endpoint or '' %}
<header class="nav">
  <div class="wrap">
    <a class="logo" href="{{ url_for('main.index') }}"><i>β</i>BETACODE</a>
    <button class="burger" id="burger" type="button" aria-label="القائمة">☰</button>
    <nav class="links" id="links">
      <a href="{{ url_for('main.index') }}" class="{{ 'on' if ep == 'main.index' }}">الرئيسية</a>
      <a href="{{ url_for('main.programs_page') }}" class="{{ 'on' if ep in ('main.programs_page','main.program_page') }}">البرامج</a>
      <a href="{{ url_for('main.updates') }}" class="{{ 'on' if ep == 'main.updates' }}">سجل التحديثات</a>
      <a href="{{ url_for('admin.login') }}">لوحة الإدارة</a>
    </nav>
  </div>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer>© {{ site_name or "BETACODE" }} — جميع الحقوق محفوظة</footer>
<script src="{{ url_for('static', filename='JS/site.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
