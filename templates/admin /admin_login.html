<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Devspark ERP - تسجيل دخول الإدارة
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1e3a8a
                );

            color: #111827;
        }


        /* ==================================================
           Login Container
           ================================================== */

        .login-container {

            width: 100%;

            max-width: 420px;
        }


        /* ==================================================
           Login Card
           ================================================== */

        .login-card {

            background: #ffffff;

            border-radius: 18px;

            padding: 34px;

            box-shadow:
                0 25px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );
        }


        /* ==================================================
           Logo
           ================================================== */

        .logo {

            width: 68px;

            height: 68px;

            margin:
                0
                auto
                18px;

            border-radius: 16px;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            font-weight: 800;

            box-shadow:
                0 8px 20px
                rgba(
                    37,
                    99,
                    235,
                    0.30
                );
        }


        /* ==================================================
           Title
           ================================================== */

        .login-title {

            text-align: center;

            font-size: 25px;

            font-weight: 800;

            color: #111827;

            margin-bottom: 7px;
        }


        .login-subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 28px;
        }


        /* ==================================================
           Flash
           ================================================== */

        .flash-container {

            margin-bottom: 18px;
        }


        .flash {

            padding:
                12px
                14px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 600;

            background: #fef2f2;

            color: #b91c1c;

            border:
                1px solid
                #fecaca;
        }


        /* ==================================================
           Form
           ================================================== */

        .form-group {

            margin-bottom: 17px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color: #374151;
        }


        input {

            width: 100%;

            height: 46px;

            padding:
                0
                13px;

            border:
                1px solid
                #d1d5db;

            border-radius: 9px;

            background: #ffffff;

            color: #111827;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.12
                );
        }


        /* ==================================================
           Login Button
           ================================================== */

        .login-button {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition:
                background 0.2s,
                transform 0.15s;
        }


        .login-button:hover {

            background: #1d4ed8;
        }


        .login-button:active {

            transform: scale(
                0.99
            );
        }


        /* ==================================================
           Footer
           ================================================== */

        .login-footer {

            text-align: center;

            margin-top: 24px;

            padding-top: 18px;

            border-top:
                1px solid
                #e5e7eb;

            color: #9ca3af;

            font-size: 11px;
        }


        @media (
            max-width: 480px
        ) {

            .login-card {

                padding: 25px 20px;

                border-radius: 14px;
            }

            .login-title {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">
            D
        </div>


        <h1 class="login-title">
            Devspark ERP
        </h1>


        <p class="login-subtitle">
            تسجيل الدخول إلى لوحة الإدارة
        </p>


        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                <div class="flash-container">

                    {% for category, message in messages %}

                        <div class="flash">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('admin.login') }}">


            <div class="form-group">

                <label for="username">
                    اسم المستخدم
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="أدخل اسم المستخدم"
                    autocomplete="username"
                    required
                    autofocus>

            </div>


            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="login-button">

                تسجيل الدخول

            </button>


        </form>


        <div class="login-footer">

            Devspark ERP
            —
            لوحة الإدارة

        </div>


    </div>


</div>


</body>

</html>
